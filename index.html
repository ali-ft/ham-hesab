<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>هم‌حساب — علی فتی</title>
  <meta name="description" content="پروتوتایپ و ارائه طراحی تجربه کاربری اپلیکیشن قرض کلاسی هم‌حساب" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #0F6B5C;
      --brand-deep: #0A4A3F;
      --brand-soft: #D8EFE9;
      --ink: #14201B;
      --muted: #5B6B64;
      --line: #D5DED9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, a, button {
      font-family: "Vazirmatn", sans-serif !important;
    }
    body {
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(700px 420px at 90% 0%, rgba(15,107,92,.16), transparent 55%),
        radial-gradient(560px 360px at 0% 100%, rgba(201,137,44,.12), transparent 50%),
        #EEF2F0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: clamp(24px, 5vw, 40px);
      box-shadow: 0 24px 60px rgba(20,32,27,.08);
      backdrop-filter: blur(10px);
    }
    .mark {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      color: #fff; display: grid; place-items: center;
      font-weight: 800; font-size: 20px; margin-bottom: 18px;
    }
    h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 800; line-height: 1.25; }
    p { margin-top: 10px; color: var(--muted); line-height: 1.8; font-size: 15px; }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }
    a.btn {
      display: grid; place-items: center;
      text-decoration: none; border-radius: 16px;
      min-height: 52px; font-weight: 700; font-size: 15px;
      padding: 12px 16px; text-align: center;
    }
    a.primary { background: var(--brand); color: #fff; }
    a.secondary {
      background: var(--brand-soft); color: var(--brand-deep);
      border: 1px solid #B7D8CF;
    }
    a.ghost {
      background: #fff; color: var(--ink);
      border: 1px solid var(--line);
    }
    .meta {
      margin-top: 18px; font-size: 13px; color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">هم</div>
    <h1>هم‌حساب</h1>
    <p>
      طراحی تجربه و رابط کاربری برای مهیمن —
      دفترچه دیجیتال ثبت قرض بین هم‌کلاسی‌ها، بدون انتقال وجه.
    </p>
    <div class="actions">
      <a class="btn primary" href="prototype/app.html">باز کردن پروتوتایپ تعاملی</a>
      <a class="btn secondary" href="presentation/index.html">مشاهده ارائه کامل UX</a>
      <a class="btn ghost" href="presentation/figma-frames.html">فریم‌های طراحی</a>
    </div>
    <p class="meta">علی فتی · دبیرستان شهید عباسی</p>
  </main>
</body>
</html>
